components:
  schemas:
    AdditionalDetail:
      title: AdditionalDetail
      type: object
      description: 'Some issue faults request additional detail. For example, if there is problem with an appliance the make and model of the appliance will be asked for. These additional questions and responses are returned as list of AdditionalDetail objects'
      properties:
        Label:
          type: string
          description: The question/prompt offered to the reporting user
        Value:
          type: string
          description: The answer
    AgencySettings:
      title: AgencySettings
      x-stoplight:
        id: c0780e23b7d69
      type: object
      properties:
        AgencyName:
          type: string
          x-stoplight:
            id: e5hu8qnab7j3x
          description: The name of the agency
        WorkflowType:
          type: string
          description: |-
            None/Basic means properties are not managed in Fixflo. Only the agent and team data is stored. Issues can be reported but not progressed through the workflow. 

            Full means properties are managed in Fixflo. All property and people data is stored in Fixflo, and issues can be progressed to Landlords/leaseholders and contractors accordingly with full Fixflo workflow functionality.
          x-stoplight:
            id: v14stuq6mb3ag
          enum:
            - Basic
            - Full
    AddJobberDetails:
      title: AddJobberDetails
      type: object
      description: Used by contractor networks only to add a jobber (contractor) to their assigned job
      properties:
        Jobber:
          $ref: '#/components/schemas/Jobber'
        JobExternalReference:
          type: string
          description: |
            The contractor network external reference for the job
    Address:
      title: Address
      type: object
      properties:
        AddressLine1:
          type: string
        AddressLine2:
          type: string
        Town:
          type: string
        County:
          type: string
        PostCode:
          type: string
        Country:
          type: string
          description: If set this should be a two letter ISO code. If the information supplied does not match an ISO code it will default to blank
    AssignedAgent:
      title: AssignedAgent
      type: object
      properties:
        Id:
          type: integer
          format: int64
        ExternalRef:
          type: string
        EmailAddress:
          type: string
        DisplayName:
          type: string
        ContactNo:
          type: string
        IsDeleted:
          type: boolean
        Brand:
          $ref: '#/components/schemas/Brand'
        UpdateDate:
          type: string
          format: date-time
          description: Updated date/time (UTC).
    Block:
      type: object
      properties:
        Id:
          type: integer
        ExternalBlockReference:
          type: string
        Name:
          type: string
        Address:
          $ref: '#/components/schemas/Address'
        IsStandAlone:
          type: boolean
        KeyReference:
          type: string
        ManagementStartDate:
          type: string
          format: date-time
          description: Management end date.
        ManagementEndDate:
          type: string
          format: date-time
          description: Management end date.
        EstateId:
          type: integer
        ExternalEstateRef:
          type: string
        LandlordId:
          type: string
        ExternalLandlordRef:
          type: string
        PropertyManager:
          $ref: '#/components/schemas/AssignedAgent'
        AssignedAgent:
          $ref: '#/components/schemas/AssignedAgent'
        IsDeleted:
          type: boolean
        Created:
          type: string
          format: date-time
          description: Created date/time (UTC).
        UpdateDate:
          type: string
          format: date-time
          description: Updated date/time (UTC).
        Warranties:
          type: array
          description: List of warranties which apply to the block
          items:
            $ref: '#/components/schemas/Warranty'
    Brand:
      title: Brand
      type: object
      properties:
        Id:
          type: string
          format: uuid
          description: Unique GUID of brand.
        Name:
          type: string
          description: Brand name
    Contractor:
      title: Contractor
      type: object
      properties:
        Id:
          type: string
          description: Unique id of contractor
        ExternalRef:
          type: string
          description: |
            This field is designed to be used to reference the contractor in other systems. If set this value must be unique for contractors
        CompanyName:
          type: string
          description: |
            Optional company name.
        Title:
          type: string
          description: |
            Title of contractor (eg Mr, Mrs, etc)
        FirstName:
          type: string
        Surname:
          type: string
        DisplayName:
          type: string
          description: |
            This value is used for addressing the contractor. For example Dear [DisplayName]
        EmailAddress:
          type: string
          description: |
            EmailAddress is also used as a login. This value must be unique for contractors.
        ContactNumber:
          type: string
        ContactNumberAlt:
          type: string
        IsDeleted:
          type: boolean
        Address:
          $ref: '#/components/schemas/Address'
        InvoiceDetails:
          $ref: '#/components/schemas/InvoiceDetails'
        Services:
          type: array
          items:
            $ref: '#/components/schemas/ContractorService'
        Certifications:
          type: array
          items:
            $ref: '#/components/schemas/ContractorCertification'
        Brand:
          $ref: '#/components/schemas/Brand'
        UpdateDate:
          format: date-time
          type: string
          description: Updated date/time (UTC).
    ContractorCertification:
      title: ContractorCertification
      type: object
      description: ''
      properties:
        id:
          type: number
          description: 'This is a legacy field, 0 will be returned in all cases'
        Name:
          type: string
          description: 'This is the name of the required certificate. Certificate names are set up on a per agency basis; a contractor may have 0 to many certificates, but must not have more than one certificate of the same name'
        Expiry:
          format: date-time
          title: DateTime
          type: string
          description: When the contractor's certification will expire
    ContractorService:
      title: ContractorService
      type: object
      properties:
        id:
          type: integer
          description: Unique id of service. When updating a contractor to have new services this is the only field that is required
        Name:
          type: string
          description: |
            This is the standard name of the service. This is what is shown within the Fixflo system
        NameAndSynonyms:
          type: array
          description: 'This is a list of other terms the service may be referred as, to help with mapping.'
          items:
            type: string
    CostCode:
      title: CostCode
      type: object
      properties:
        BlockId:
          type: number
          description: |
            Unique id of the block the cost code is assigned to
        ExternalBlockRef:
          type: string
          description: |
            External reference for the block the cost code is assigned to
        IsDeleted:
          type: boolean
        CostCode:
          type: string
          description: |
            the value that will be sent in the costcode field on the issue when this is attached to the issue in fixflo
        Description:
          type: string
          description: |
            Human readable description of the cost code
        EstateId:
          type: integer
        ExternalEstateRef:
          type: string
    Envelope:
      title: Envelope
      type: object
      description: This object is used to carry/return responses following post operations.
      properties:
        HttpStatusCode:
          type: integer
        HttpStatusCodeDesc:
          type: string
        Errors:
          type: array
          items:
            type: string
        Messages:
          type: array
          items:
            type: string
    Estate:
      title: Estate
      type: object
      properties:
        id:
          type: integer
          description: |
            Unique Id of the Estate
        Name:
          type: string
        ExternalEstateRef:
          type: string
          description: |
            This field is designed to be used as the reference of the estate in the other (your) system. If set, this value must be unique for estates.
        AssignedAgent:
          $ref: '#/components/schemas/AssignedAgent'
        IsDeleted:
          type: boolean
          description: |
