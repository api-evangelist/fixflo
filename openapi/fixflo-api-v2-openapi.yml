    Issue:
      title: Issue
      type: object
      properties:
        Id:
          type: string
          maxLength: 20
          description: |
            Unique Id of issue
        TenantId:
          type: string
          description: |
            Unique tenant id (internal, Fixflo)
        ExternalRefTenancyAgreement:
          type: string
          description: |
            This optional value is entered by the tenant on issue submission. This value represents the tenancy agreement number as stored by a system external for Fixflo. It may be useful in matching new issue reports with existing tenancies
        Title:
          type: string
          description: |
            Title of issue (do not confuse with tenant title). This title may be edited in Fixflo plus
        FaultTitle:
          type: string
          description: |
            Title of fault. This is text title of the fault. This is initially derived from the fault category. Fixflo plus users may edit this value
        FaultCategory:
          type: string
          description: |
            This is the canonical description of the fault. It is readonly. The value is derived from the selected fault (icons) and sub categories
        AdditionalDetails:
          type: array
          description: |
            Some issue faults request additional detail. For example, if there is problem with an appliance the make and model of the appliance will be asked for. These additional questions and responses are returned in the field AdditionalDetails as a AdditionalDetail []
          items:
            $ref: '#/components/schemas/AdditionalDetail'
        FaultNotes:
          type: string
          description: |
            User input fault notes
        FaultPriority:
          type: string
          description: |
            Fault priority, integer range 0 to 5 where 0 - Emergency, 1 - Urgent (high), 2 - Urgent (high), 3 - Non-urgent (high), 4 - Non-urgent (med), 5 - Non-urgent (low)
        Salutation:
          type: string
          description: |
            Tenant title (Mr, Mrs, Ms, etc)
        Firstname:
          type: string
        Surname:
          type: string
        EmailAddress:
          type: string
          description: |
            Tenant email address
        Address:
          $ref: '#/components/schemas/Address'
        Media:
          $ref: '#/components/schemas/Media'
        TenantNotes:
          type: string
          description: |
            Further input notes
        StatusChanged:
          type: string
          format: date-time
          description: StatusChanged date/time (UTC). Read-only.
        Status:
          type: string
          description: |
            Issue status. Values are: Reported, QuotesRequested, QuotesAwaitingReview, QuotesReviewed, JobAwarded, AwaitingJobCompletion, JobCompleted, Closed. Available as an enum in the nuget-package
        Created:
          type: string
          format: date-time
          description: Created date/time (UTC).
        TenantPresenceRequested:
          type: string
          description: |
            Has the tenant requested to be present
        TenantAcceptComplete:
          type: string
          description: |
            Have the issue submission terms and conditions been accepted
        TermsAccepted:
          type: string
        CallbackId:
          type: string
          description: |
            see Plugin Example for description and use case
        Property:
          type: string
          description: |
            The Property to which the issue relates. Please note in some scenarios this field will return a null value - these should be handled appropriately
        Block:
          $ref: '#/components/schemas/Block'
        Job:
          $ref: '#/components/schemas/Job'
        FaultTree:
          $ref: '#/components/schemas/FaultTree'
        WorksAuthorisationLimit:
          type: number
          description: |
            If a contractor is instructed, without having previously supplied a quote, this is maximum allowed cost of works. This value may be overridden manually on a per issue basis but by default will be derived from the agency, landlord or block as appropriate
        BlockName:
          type: string
          description: |
            The block name supplied when the issue is reported
