    IssueDraft:
      title: IssueDraft
      type: object
      description: |-
        This DTO provides support for the creation and update of draft issues. A use case might be where a 3rd party system creates new issues on behalf of an agency. In such a case, a new IssueDraft object is created, documents (such as pictures) are added then the IssueDraft is committed to a live issue.

        If a combination of Address, PropertyId and ExternalPropertyRef is used they must refer to the same property, otherwise the create/update will fail with an error.
      properties:
        id:
          type: string
          format: uuid
          description: Unique GUID of IssueDraft.
        Updated:
          format: date-time
          type: string
          description: Updated date/time (UTC).
        IssueTitle:
          type: string
          description: |
            Title of the issue. If not specified this will default to an appropriate value based on the Fault id and.or the fault notes.
        FaultId:
          type: string
          description: |
            This is a the unique id of the type of fault. If left as zero this will default to the fault "Planned maintenance (Other)". Other supported fault ids are listed [here](13741f28addb7-fault-ids)
        FaultPriority:
          type: integer
          description: |
            Overrides the default issue priority for the given fault ID. Integer from 0 (emergency) to 5 (Non-urgent).
        FaultNotes:
          type: string
          description: |
            A description of the fault. This is required.
        IssueDraftMedia:
          type: object
          description: |
            DEPRECATED - This field is still returned but never populated. Please use the endpoint here to get IssueDraftMedia
        Title:
          type: string
          description: |
            The tenant/occupiers title. Typically, Mr, Mrs, Ms etc
        FirstName:
          type: string
          description: |
            The tenant/occupiers first name
        Surname:
          type: string
          description: |
            The tenant/occupiers surname (aka family name)
        EmailAddress:
          type: string
          description: |
            The email address of the occupier
        ContactNumber:
          type: string
          description: |
            The contact phone number of the occupier
        ContactNumberAlt:
          type: string
          description: |
            Alternate contact phone number of the occupier
        Address:
          $ref: '#/components/schemas/Address'
        PropertyId:
          type: integer
          description: |
            PropertyId of the reporting property, if known. Can be used instead of the address to identify the location of the issue (This value will always be 0 on GET requests)
        BlockId:
          type: integer
          description: |
            BlockId of the reporting block, if known.
        PresenceRequired:
          description: |
            Whether the occupier has indicated that they wish to be present when works are carried out
          type: boolean
        VulnerableOccupier:
          type: boolean
          description: |
            Whether the occupier considers at least one of the occupiers to be vulnerable
        ExternalPropertyRef:
          type: string
          description: |
            External Reference of the reporting property, if known. Can be used instead of the address to identify the location of the issue (This value will always be null on GET requests)
        ExternalBlockRef:
          type: integer
          description: |
            External Reference of the reporting block, if known.
        IssueLocationType:
          type: string
          enum:
            - Private
            - Communal
          description: |-
            The location type of the issue, whether it is happing in a private or communal space.

            Coming in release 148.
      required:
        - FaultId
    IssueDraftMedia:
      title: IssueDraftMedia
      type: object
      description: |
        This DTO is used in conjunction with Fixflo.WebApi.V2.DTO.IssueDraftMedia to support the uploading of media (documents and images)
      properties:
        id:
          type: string
          format: uuid
          description: Unique GUID of IssueDraftMedia.
        IssueDraftId:
          type: string
          format: uuid
          description: Unique GUID of IssueDraft.
        Url:
          type: string
          description: |
            The url of the object for download. This value is readonly
        "ContentType\t":
          type: string
          description: |-
            The content and mime type of the document eg. example image/png. On POST, if the content type is left blank the content type will be derived from the ShortDesc field. For example where:

            * ContentType = null and a ShortDesc = "picture1.png" a content type of image/png will be derived
            * ContentType = "image/png" and a ShortDesc= "picture1" a content type of image/png will be derived
            * ContentType = "" and a ShortDesc = "picture1" will result in an error
            * ContentType = "xxxxx" and a ShortDesc = "picture1" will result in an error as the content type is not recognised.
        ShortDesc:
          type: string
          description: |
            A short description of the document (eg file name)
        EncodedByteData:
          type: string
          description: |
            Used for POST only. This data represents the binary document encoded to base-64
