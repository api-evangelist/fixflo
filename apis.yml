apis:
- aid: fixflo:fixflo-api-v2
  name: Fixflo API v2
  description: The Fixflo v2 REST API, described by a publicly downloadable OpenAPI 3.0 document on the
    Fixflo Stoplight developer portal. It exposes the repairs and maintenance domain — issues and issue
    drafts, properties, blocks and estates, agencies, agents, brands and teams, landlords, leaseholders,
    tenants and customers, contractors and contractor networks, assets and warranties, cost codes, service
    programmes, service agreements and service events, jobs, custom field configuration and webhook subscriptions.
    Authentication is a bearer token issued inside a Fixflo account (documented as OAuth2-aligned but
    deliberately not a full OAuth2 implementation), and a separate OpenID Connect discovery document is
    served anonymously at api.fixflo.com. Production calls are made against the customer's own subdomain
    (https://[subdomain].fixflo.com/api/v2); the published server is the shared sandbox. Rate limiting
    is documented as not below 500 requests per minute, returning HTTP 429. Use of the API requires the
    signed Fixflo Application Developer and API Licence Agreement.
  humanURL: https://api-docs.fixflo.com/
  baseURL: https://api-sandbox.fixflo.com/api/v2
