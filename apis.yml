aid: fixflo
url: https://raw.githubusercontent.com/api-evangelist/fixflo/refs/heads/main/apis.yml
name: Fixflo
kind: company
description: Fixflo (a trading name of Tactile Limited, London, United Kingdom, acquired by Aareon in
  2021) is a UK repairs, maintenance and compliance management platform for lettings agents, block managers
  and commercial property managers. Occupiers report issues through a guided fault tree, and Fixflo routes
  the work to contractors, tracks jobs, service programmes, warranties and invoices, and syncs the resulting
  records back into the agency CRM. It sits in the post-tenancy operations layer of the UK property value
  chain rather than the listings layer — the UK has no MLS and no RESO, so there is no industry-mandated
  machine-readable listing contract here and Fixflo makes no RESO claim. Its API posture is unusually
  open for the sector in one respect and closed in another. A genuinely public Stoplight developer portal
  at api-docs.fixflo.com publishes a complete OpenAPI 3.0 description of the v2 API (135 paths, 164 operations,
  25 resource tags) that anyone can read and download without logging in, but actually calling it is licensed.
  Every use of the API is subject to the signed Fixflo Application Developer and API Licence Agreement,
  keys are issued by support after a review of the use case, and the runtime base URL is the customer's
  own per-tenant subdomain. Read the contract freely; sign an agreement to use it.
deliveryModel:
  model: saas
  open_source: false
  commercial: true
  callable_host: true
