apiFamily:
  documentedSegmentation: |
    The portal presents ONE HTTP service ("Fixflo", v2.0) segmented by 25
    resource tags rather than a family of separately-branded APIs. The real
    product segmentation the docs use is: issue reporting (Issue, Issue draft,
    FaultTree), property records (Property, Block, Estate, Asset, Warranty),
    parties (Agency, Agent, Brand, Team, Landlord, Leaseholder, Tenant,
    Customer, Contractor, Contractor networks), planned maintenance (Service
    programme definition, Service Programme, Service Agreement, Service Event),
    finance (Cost code, Job), and platform (Webhook, CustomFieldConfiguration).
    There is no listings/search API, no valuation/AVM API, no title or escrow
    API, and no payments API — those are simply not Fixflo's part of the value
    chain.
  documentedButUndocumentedVersions:
    v1: 'Verbatim: "Version V1 - released April 26th 2013. Not supported.
      Documentation is not published. Please do not use." Not represented in
      apis.yml.'
rateLimits:
  documented: true
  verbatim: 'Rate limiting is used. The limit is under constant review, but currently
    is not below 500 requests a minute. If the limit is hit a 429 http error will be
    returned.'
