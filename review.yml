aid: fixflo
name: Fixflo
review:
  question: Does Fixflo publish a real, machine-readable, publicly reachable API contract,
    and what does a developer actually have to sign or join to call it?
  answer: true
  date: '2026-07-26'
  reviewer: API Evangelist
  homeMarket: United Kingdom
  summary: |
    Fixflo publishes a genuinely public Stoplight Elements developer portal at
    https://api-docs.fixflo.com/ (HTTP 200) that anyone can read anonymously.
    Behind it is a complete OpenAPI 3.0.0 description of the Fixflo v2 API,
    exported verbatim to openapi/fixflo-api-v2-openapi.yml — 135 paths,
    164 operations, 67 component schemas, 25 resource tags. The contract is
    open; the runtime is not. info.termsOfService and info.license in the spec
    itself both point at the "System Application Developer and API License
    Agreement" PDF, and the portal's own Introduction page states plainly that
    "Any use of the Fixflo API is subject to the Application Developer and API
    Licence Agreement." Keys are not self-serve: the documented path is to
    contact support@fixflo.com, describe the use case, register the app, and
    have the licence agreement sent for signature before an account and access
    are provided.
sector:
  homeMarket: United Kingdom
  segment: Property management / repairs, maintenance and compliance operations
  valueChainPosition: |
    Post-tenancy operations, not listings. Fixflo sits underneath the agency CRM
    (Reapit, Alto, Acquaint, Veco, Arthur, Rentman, AgentOS and ~40 others) and
    handles the repair lifecycle. It never touches the Rightmove/Zoopla portal
    duopoly that controls UK residential listing distribution, so none of the
    listing-syndication questions (IDX, VOW, feed licences) apply to it.
resoPosture:
  certified: false
  posture: No RESO reference found — RESO is absent from the UK market and from Fixflo
  verbatim: |
    No RESO reference of any kind was found. Fixflo is a UK company operating in
    a market with no MLS and no cooperative listing standard, and RESO
    certification is administered around US/Canadian MLS participation. Searched
    the Fixflo site, the api-docs.fixflo.com portal content, and the exported
    OpenAPI: the strings "RESO", "Data Dictionary", "OData", "$metadata" and
    "UPI"/"Universal Property Identifier" do not appear anywhere in the
    212 KB OpenAPI document or the portal articles. No RESO Web API
    certification, no RESO Data Dictionary certification (any version), no
    listing in the RESO certification directory, no OData service root and no
    $metadata document. Fixflo's identifiers are GUIDs scoped to a single
    agency tenant, documented in a dedicated "Guid values" portal article —
    there is no cross-market property identifier at all.
  probed:
  - url: https://api-docs.fixflo.com/
    status: 200
    note: Stoplight Elements dev portal, projectId cHJqOjczOTUy. No RESO/OData surface.
  - url: https://api.fixflo.com/$metadata
    status: not-served
    note: api.fixflo.com serves a login-wall catch-all (302 to /Auth/Login) for every
      unmatched path; no OData metadata document exists.
accessGate:
  gate: licence-agreement
  gated: true
  whatMustBeSignedOrJoined: |
    The Fixflo "System Application Developer and API License Agreement"
    (PDF, HTTP 200, 63,096 bytes, application/pdf) at
    https://fixflostore.blob.core.windows.net/live-assets/SystemApplicationDeveloperAndAPILicenseAgreement.pdf
    must be signed. The published path is: email support@fixflo.com describing
    the intended use case, register the app/integration, receive and sign the
    API agreement, and then be provisioned an account and access (and, on
    request, a sandbox instance). There is no signup form, no developer
    dashboard, and no self-serve key issuance anywhere on fixflo.com. There is
    also a prerequisite that a Fixflo agency account exists — tokens are
    generated by a user from inside their own live Fixflo system, so a pure
    third-party developer with no Fixflo customer relationship cannot obtain a
    working credential.
  selfServeSignupFound: false
  documentationPubliclyReadable: true
  note: |
    Documentation openness and runtime openness are separate facts here. The
    OpenAPI is downloadable by anyone; the API is not callable by anyone.
openData:
  exists: false
  note: |
    Fixflo publishes no open dataset. It is a private SaaS operating on a single
    customer's tenanted repair data. The UK's genuinely open property data layer
    (HM Land Registry Price Paid Data / ownership data under Open Government
    Licence, and Ordnance Survey open addressing and mapping products) sits
    entirely outside Fixflo and is not consumed or re-published by any
    documented Fixflo endpoint.
authModel:
  scheme: HTTP Bearer token
  openapiSecuritySchemes:
    Bearer:
      type: http
      scheme: bearer
  verbatimFromDocs: |
    "Token based authentication is implemented in alignment with OAuth2
    standards but the full range of OAuth2 functionality is not required and has
    not been implemented." Authorisation uses an `Authorization: Bearer [token]`
    header; the token is a 64-character alphanumeric string generated by a user
    from inside their Fixflo system, and is described as separate from the
    user's password so third parties may store it.
  openidConnectDiscovery:
    url: https://api.fixflo.com/.well-known/openid-configuration
    status: 200
    contentType: application/json;charset=UTF-8
    fetched: '2026-07-26'
    savedTo: authentication/fixflo-openid-configuration.json
    anonymous: true
    issuer: https://api.fixflo.com/
    grantTypesSupported:
    - password
    - authorization_code
    - refresh_token
    scopesSupported:
    - openid
    - offline_access
    - profile
    - email
    note: |
      A real OIDC discovery document is served anonymously and describes the
      Fixflo application login (authorize/token/introspection/logout/userinfo,
      RS256, PKCE S256). It governs the Fixflo web application, not the
      documented v2 REST API surface, which the OpenAPI declares as plain HTTP
      bearer. Both facts are recorded; neither is used to imply the other.
  jwks:
    url: https://api.fixflo.com/.well-known/jwks
    status: 200
    contentType: application/json;charset=UTF-8
webhooksEventsSdksPostman:
  webhooks:
    exists: true
    documentation: https://api-docs.fixflo.com/5cc9374300b99-webhooks
    managementApi: true
    managementNote: The OpenAPI carries a `Webhook` tag with operations for managing
      webhook subscriptions.
    events:
    - Issue state change
    eventsNote: 'Verbatim from the docs: "So far, users can only subscribe to one
      event, but we will be adding more in future." Exactly one event type is
      documented.'
    signing: HMAC SHA256 over the raw body using a configured shared secret, delivered
      in an `ff-signature` header of the form `sha256={hash}`.
    sourceHost: webhook.fixflo.com (CNAME, documented as the webhook source address
      for firewall allow-listing)
  sdks:
    - name: Fixflo.WebApi.Client.V2
      language: .NET
      url: https://www.nuget.org/packages/Fixflo.WebApi.Client.V2/
      status: 200
      note: Official NuGet client referenced from the developer portal introduction.
        No JavaScript, Python, PHP, Ruby, Java or Go SDK is published.
  postman:
    url: https://www.postman.com/fixflo/fixflo-public/collection/glxckcp/fixflo-docs
    status: 200
    note: A public Postman workspace "fixflo-public" with a "Fixflo docs" collection
      exists and is linked from search; collection contents were not machine-exported
      because Postman renders the collection client-side and exposes no anonymous
      JSON export for it. Recorded as a link only, not harvested.
  graphql:
    exists: false
  asyncapi:
    exists: false
  mcp:
    exists: false
    note: No MCP server, agent skill, or llms.txt was found on fixflo.com or
      api-docs.fixflo.com.
