  policy_summary: >-
    Fixflo states a real, if terse, deprecation posture in the Versions section
    of its developer portal: breaking changes create a new URI version, a
    version is explicitly marked Supported or Not supported, and a retired
    version is given a stated deprecation date (v1, planned for deprecation
    October 2016). That is the whole of the published policy — there is no
    notice-period commitment and no separate deprecation policy page.
