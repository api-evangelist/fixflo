core_spine:
  description: >-
    The load-bearing path through the model. An occupier walks the fault tree to
    produce an IssueDraft, the draft commits into an Issue against a Property
    (which may sit in a Block, which may sit in an Estate), the Issue is quoted
    and awarded as a Job to a Contractor, and planned compliance work runs in
    parallel as ServiceProgrammes that emit ServiceEvents against the same
    Property or Block.
  path: FaultTree -> IssueDraft -> Issue -> Quote -> Job -> Contractor
  parallel: ServiceProgrammeDef -> ServiceProgramme -> ServiceEvent
